<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标状态与通知</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0058bd}a:hover{color:#00428f}
</style>
</helmet>
<div style="width: 1200px; height: 600px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 40px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #1d1d1f; background: #f5f5f7">

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">菜单栏图标</h2>
      <span style="font-size: 13px; color: #6e6e73">单色模板图标，只用一个状态点表达优先级最高的状态</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{icons}}" as="item" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04)">
          <div style="height: 56px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: linear-gradient(155deg, #b7c8dc 0%, #d6d2d7 46%, #e7cdbb 100%)">
            <div style="height: 28px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; background: rgba(246,246,246,0.75); backdrop-filter: blur(20px)">
              <span style="height: 22px; padding: 0 6px; display: flex; align-items: center; gap: 5px; color: #1d1d1f">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="3.2" width="11" height="10" rx="2.6" stroke="currentColor" stroke-width="1.4"></rect><path d="M4.4 7.1h5M4.4 9.9h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><circle cx="12.9" cy="3.6" r="2.7" fill="{{item.dot}}"></circle></svg>
                <sc-if value="{{item.badge}}" hint-placeholder-val="{{false}}">
                  <span style="min-width: 16px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #c2410c; color: #ffffff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
                </sc-if>
                <sc-if value="{{item.paused}}" hint-placeholder-val="{{false}}">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 4.2A3.6 3.6 0 0 1 11.6 6v2.4l1.3 2.2H6.5M4.4 6.6v1.8L3.1 10.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2.5 2.5l11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>
                </sc-if>
              </span>
              <span style="font-size: 12px; color: #3a3a3c; font-variant-numeric: tabular-nums">14:32</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 13px; font-weight: 600">{{item.name}}</span>
            <span style="font-size: 12px; color: #6e6e73; line-height: 1.45">{{item.desc}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">系统通知</h2>
      <span style="font-size: 13px; color: #6e6e73">只在变成「等你」或「已完成」时发送，启动时的首次扫描不通知</span>
    </div>
    <div style="display: flex; gap: 32px; padding: 28px; border-radius: 16px; background: linear-gradient(155deg, #b7c8dc 0%, #d6d2d7 46%, #e7cdbb 100%)">
      <sc-for list="{{notes}}" as="item" hint-placeholder-count="2">
        <div style="width: 372px; box-sizing: border-box; padding: 12px 14px; border-radius: 18px; display: flex; gap: 12px; align-items: flex-start; background: rgba(246,246,246,0.84); backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.12), 0 10px 30px rgba(30,30,50,0.16)">
          <span style="width: 38px; height: 38px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #1d1d1f; color: #ffffff">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="3.2" width="11" height="10" rx="2.6" stroke="currentColor" stroke-width="1.3"></rect><path d="M4.4 7.1h5M4.4 9.9h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path><circle cx="12.9" cy="3.6" r="2.5" fill="{{item.dot}}"></circle></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: baseline; gap: 8px">
              <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</span>
              <span style="flex: none; font-size: 11px; color: #6e6e73">{{item.time}}</span>
            </span>
            <span style="font-size: 13px; color: #1d1d1f">{{item.sub}}</span>
            <span style="font-size: 12px; color: #48484a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: {{item.font}}">{{item.body}}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      icons: [
        { name: '无活动', desc: '没有活跃会话，只显示轮廓图标', dot: 'transparent', badge: false, paused: false },
        { name: '运行中', desc: '有会话在跑，没有需要你处理的', dot: '#0a84ff', badge: false, paused: false },
        { name: '已完成', desc: '有完成但未查看的会话', dot: '#34c759', badge: false, paused: false },
        { name: '等你回复', desc: '橙点加数量角标，优先级最高', dot: '#f0841c', badge: true, paused: false },
        { name: '通知已暂停', desc: '状态点照常显示，附铃铛划线', dot: '#f0841c', badge: false, paused: true }
      ],
      notes: [
        { title: 'Codex · 重构 Cookie 同步逻辑', time: '现在', sub: '等待授权', body: 'git push --force origin main', font: "ui-monospace, 'SF Mono', Menlo, monospace", dot: '#f0841c' },
        { title: 'Antigravity · Loon 规则整理', time: '2 分钟前', sub: '已完成 · 用时 6 分 12 秒', body: '已生成 3 个文件，测试全部通过', font: 'inherit', dot: '#34c759' }
      ]
    };
  }
}
</script>
</body>
</html>
